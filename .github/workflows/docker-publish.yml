# Docker 镜像构建与发布工作流
# 在推送代码或发布 Release 时自动构建 Docker 镜像并推送到 Docker Hub

name: 构建并发布 Docker 镜像

on:
  # 手动触发
  workflow_dispatch:
  # 推送到 main/master 分支时触发
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  # 创建 Release 时触发
  release:
    types: [published]

env:
  # Docker Hub 仓库地址，格式：用户名/镜像名
  IMAGE_NAME: akaishuichiw/qq-farm-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 检出代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 设置 QEMU（支持多平台构建）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 提取 Docker 元数据（标签和标注）
      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 分支名标签（如 main → main）
            type=ref,event=branch
            # Release 标签（如 v2.2.2 → v2.2.2）
            type=semver,pattern={{version}}
            # Release 主版本标签（如 v2.2.2 → v2）
            type=semver,pattern={{major}}.{{minor}}
            # 每次推送 main/master 时标记为 latest
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
